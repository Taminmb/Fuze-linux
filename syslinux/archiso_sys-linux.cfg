LABEL fuzeiii
TEXT HELP
Boot the Fuze Linux install medium on BIOS.
It allows you to install Fuze Linux or perform system maintenance.
ENDTEXT
MENU LABEL Fuze Linux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL fuzespeech
TEXT HELP  
Boot the Fuze Linux install medium on BIOS with speakup screen reader.
It allows you to install Fuze Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Fuze Linux install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
