LABEL arch
TEXT HELP
Boot the Fuze Linux install medium on BIOS.
It allows you to install Fuze Linux or perform maintenance.
ENDTEXT
MENU LABEL Fuze Linux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% loglevel=7 debug
